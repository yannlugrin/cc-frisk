# Bumps ci.yml's commit-pinned actions, rewriting the version comment
# with the SHA. github-actions only, and why: D-027.
---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Maintenance belonging to no step — CLAUDE.md rule 6's `meta: …`.
    commit-message:
      prefix: "meta"
    open-pull-requests-limit: 3
