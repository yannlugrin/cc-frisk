# CI runs this repository's own entry points and nothing else, so a check
# cannot exist on one side and not the other. Pins and the check family:
# D-027. Why there is no scheduled run: PLAN.md 005.
---
name: ci

# Work lands on main at a step close; keeping tags out stops the
# annotated step-NNN tag re-verifying the commit its own push just did.
# pull_request covers what a push trigger cannot see: a fork.
"on":
  push:
    branches: [main]
  pull_request:

# One run per ref: a superseded verdict nobody reads is what teaches
# people to stop reading them. Never on main, where a run is the record
# that an approved step passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Independent questions — is what is committed well-formed, is the
      # implementation right — so neither waits on or cancels the other.
      fail-fast: false
      matrix:
        target: [check, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          # This workstation's interpreter. The floor runs in its own
          # job below; the full matrix arrives at PLAN.md 029.
          python-version: "3.14"

      # Keyed exactly, no restore-keys: a near-miss restores an
      # environment still holding a package requirements.txt no longer
      # names, and pip does not uninstall what left the file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache the Python environment
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-py${{ steps.python.outputs.python-version
            }}-${{ hashFiles('requirements.txt') }}

      # `check` only: `just test` never invokes pre-commit, so sharing
      # this key would let the empty job win the race to save it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache the pre-commit hook environments
        if: matrix.target == 'check'
        with:
          path: ~/.cache/pre-commit
          key: >-
            hooks-${{ runner.os }}-py${{ steps.python.outputs.python-version
            }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Tracks the workstation's version, not the newest release: the
      # point of the pin is that both places run the same program.
      - name: Install just
        run: pipx install rust-just==1.45.0

      - name: Install the pinned toolchain
        run: just setup

      # Both guard gates key on refs/backups/bash-guard, which no clone
      # receives, so the guard-execution half reports absent by design
      # here. The governance half runs, and can fail.
      - name: Run just ${{ matrix.target }}
        run: just ${{ matrix.target }}

  # The interpreter floor, executed rather than asserted (D-029, D-030).
  # ruff's target-version and mypy's python_version judge the code
  # against 3.9 on the `check` job's 3.14; this job runs it there.
  #
  # No `just setup` and no caches: the engine has zero dependencies and
  # the suite needs nothing installed, which is the whole reason a bare
  # floor interpreter can run it. Installing the pinned toolchain here
  # would prove the toolchain's floor instead of the engine's.
  floor:
    name: test on the interpreter floor (3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The committed floor. Spelled here, in pyproject.toml's
          # requires-python, and in its ruff and mypy sections — moving
          # it means moving all four, plus the verification record.
          python-version: "3.9"

      - name: Install just
        run: pipx install rust-just==1.45.0

      - name: Run just test
        run: just test
