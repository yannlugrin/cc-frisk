# CI runs this repository's own entry points and nothing else, so a check
# cannot exist on one side and not the other. Pins and the check family:
# D-027. Why there is no scheduled run: PLAN.md 005.
---
name: ci

# Work lands on main at a step close; keeping tags out stops the
# annotated step-NNN tag re-verifying the commit its own push just did.
# pull_request covers what a push trigger cannot see: a fork.
"on":
  push:
    branches: [main]
  pull_request:

# One run per ref: a superseded verdict nobody reads is what teaches
# people to stop reading them. Never on main, where a run is the record
# that an approved step passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Is what is committed well-formed? One interpreter, because the
  # toolchain is pinned to this workstation (D-027): running the hooks
  # at the engine's floor would prove the *toolchain's* floor instead.
  # This is also the only job that runs `just setup`, so it is where a
  # from-nothing install of the pinned toolchain is proven.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          # This workstation's interpreter. The engine's floor is a row
          # of the test matrix below, not a property of this job.
          python-version: "3.14"

      # Keyed exactly, no restore-keys: a near-miss restores an
      # environment still holding a package requirements.txt no longer
      # names, and pip does not uninstall what left the file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache the Python environment
        with:
          path: .venv
          key: >-
            venv-${{ runner.os }}-py${{ steps.python.outputs.python-version
            }}-${{ hashFiles('requirements.txt') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache the pre-commit hook environments
        with:
          path: ~/.cache/pre-commit
          key: >-
            hooks-${{ runner.os }}-py${{ steps.python.outputs.python-version
            }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Tracks the workstation's version, not the newest release: the
      # point of the pin is that both places run the same program.
      - name: Install just
        run: pipx install rust-just==1.45.0

      - name: Install the pinned toolchain
        run: just setup

      # Both guard gates key on refs/backups/bash-guard, which no clone
      # receives, so the guard-execution half reports absent by design
      # here. The governance half runs, and can fail.
      - name: Run just check
        run: just check

  # Is the implementation right? Once per interpreter, because a floor
  # that nothing executes is a claim (D-029, D-030). The engine has zero
  # dependencies and the suite needs nothing installed, so no `just
  # setup`, no virtualenv and no cache: every row runs the way an
  # operator's bare `python3` would.
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Independent verdicts; one failing row must not cancel the other,
      # since which versions fail is the whole information.
      fail-fast: false
      matrix:
        # The committed floor and this workstation's version — §11's
        # minimum. Extending the list is adding a string; 029 decides
        # whether a release wants more of the range covered.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install just
        run: pipx install rust-just==1.45.0

      - name: Run just test
        run: just test

      # §8.2's repository-installable door, on every version the engine
      # claims. It also holds the build backend honest — setuptools 83
      # and later require 3.10, so a pin that drifted above the floor
      # would fail here rather than on an adopter's runner.
      - name: Install the engine the way a project's CI would
        run: |
          python3 -m pip install .
          frisk --version
