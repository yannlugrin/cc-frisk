# The repository-installable door (§11: one codebase, two doors).
#
# This file describes the engine as a Python package: `pip install .`
# gives a project's CI the same code the hook runs, plus a `frisk`
# console script (§8.2). It is *not* how frisk reaches a machine where
# the plugin is installed — §2.2 forbids the plugin from requiring an
# installation step, so the plugin-side invocation is build-free and is
# decided at PLAN.md 021. Until then, `python3 -m frisk` is that door.

[build-system]
# The backend's own floor must not sit above the engine's: setuptools
# 83 and later require Python 3.10, so pinning one of those here would
# leave `pip install .` unresolvable on exactly the platforms the floor
# exists for (RHEL 9, Amazon Linux 2023, the macOS command-line tools).
# 77 is where the PEP 639 `license` expression below became supported.
# The floor job in CI installs this package on 3.9, so the constraint is
# checked rather than reasoned about.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frisk"
description = "A parsing-based guard for Claude Code's Bash tool."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Yann Lugrin" }]

# Zero dependencies is a requirement, not an accident (§3.1): the audit
# surface of code in the permission path must equal the repository, and
# the install must stay build-free. tests/test_packaging.py fails if an
# import ever escapes the standard library.
dependencies = []

dynamic = ["version"]

[project.scripts]
frisk = "frisk.cli:main"

[project.urls]
Homepage = "https://github.com/yannlugrin/cc-frisk"
Source = "https://github.com/yannlugrin/cc-frisk"

[tool.setuptools.dynamic]
# One source for the version, and it is the code — the CLI reports it
# without the package being installed, which the plugin door needs.
version = { attr = "frisk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
# The interpreter floor, so a construct the floor cannot run is a lint
# failure here rather than a parse error on an operator's machine
# (§3.1, D-029).
target-version = "py39"
# pre-commit passes filenames explicitly, and ruff honours `exclude` for
# those only when this is set.
force-exclude = true

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus: full pycodestyle, isort, bugbear,
# pyupgrade and flake8-simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
# The other half of the floor check: mypy judges the code against 3.9's
# standard library, so a name that arrived in 3.10 is caught here even
# though this workstation runs 3.14.
python_version = "3.9"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
