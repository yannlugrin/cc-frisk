# The check families for this repository, pinned.
#
# `just check` and the commit hook both run this file, so the local
# runners cannot diverge: the commit hook judges what is about to be
# committed, `just check` what is on disk.
#
# Families arrive with the first artifact of their class, never ahead of
# it, so a green gate never says anything about files that are not there.
# Present at step 000: YAML, JSON, POSIX shell, Markdown, repository
# hygiene and security, and whitespace discipline. The guard's own
# liveness gate joined at step 001. Governance frontmatter joined at
# step 003 with the first skill, and brought with it the first `.py`
# file this repository ships, so Python *well-formedness* joined in the
# same breath — it parses, and it carries no debugger left behind.
# Python style and TOML still join at step 006 with the engine, where
# there is a body of code for a style to be about.
---
exclude: |
  (?x)^(
      \.claude/spec-work/.*
    | \.claude/refs/.*
  )$

repos:
  # Repository hygiene and security, and whitespace discipline. The
  # stock collection of the runner, pinned, no code written.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Whitespace and newline discipline. These are fixers: the commit
      # hook is where they write, and `just check` reverts and reports
      # instead (scripts/check.sh says why).
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Hygiene
      - id: check-merge-conflict
      - id: check-added-large-files
        # --enforce-all, because without it the hook intersects its file
        # list with what is *staged*, so it checks nothing at all when
        # run from `just check` or CI.
        args: [--maxkb=512, --enforce-all]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # Security — CLAUDE.md rule 5. A committed secret is a rotated
      # secret, so this is the one family whose breach cannot be undone
      # by noticing it afterwards. This project has no secrets story of
      # its own (§15: nothing at runtime touches a network or holds a
      # credential), so what this guards against is an accidental paste,
      # and a pasted private key is the shape that would actually appear.
      - id: detect-private-key

      # Python well-formedness. Not style — that arrives at step 006
      # with the engine. These two ask the same question the rest of
      # this file asks: does the artifact load, and does it carry
      # anything that should never have been committed.
      - id: check-ast
      - id: debug-statements

      # JSON parse. .claude/settings.json is the permission enforcement
      # mechanism itself, so a malformed edit to it fails exactly as
      # quietly as a skill that never loads. YAML needs no hook here:
      # yamllint --strict below already fails on a parse error.
      - id: check-json

  # YAML lint. The hook runner's own configuration is the first artifact
  # of this class.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  # POSIX shell lint. shellcheck ships as a pinned binary inside this
  # hook's environment, so it is not a system prerequisite.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Markdown and prose lint over the governance documents. In this
  # repository documents are load-bearing.
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        args: [--config, .pymarkdown.json, scan]

  # Governance well-formedness, and the development guard's liveness.
  # Nothing standard exists for either: no ecosystem tool knows what a
  # Claude Code settings file must still be true for, and the guard is
  # this repository's own. Both questions are asked by one script
  # because they share a subject — the boundary — and neither costs more
  # than a few milliseconds.
  #
  # always_run, because what it hunts is invisible to a file list: the
  # guard is gitignored and so never appears in one, and a settings file
  # that quietly stopped pointing at it is unchanged on the commit that
  # matters. Measured on pre-commit 4.4.0: an always_run hook with
  # pass_filenames: false runs even when --files names something else,
  # and its non-zero exit fails the run (.claude/docs/harness.md).
  - repo: local
    hooks:
      # Governance well-formedness for the rituals themselves: every
      # skill and agent definition parses and agrees with its own path.
      # A malformed one does not fail — it silently never loads, and a
      # ritual nobody can invoke is indistinguishable from one nobody
      # needed. Nothing in the ecosystem asks that question.
      #
      # It runs on the project interpreter rather than an isolated hook
      # environment because it imports PyYAML, pinned in
      # requirements.txt; `.venv` is guaranteed wherever pre-commit
      # runs, since pre-commit itself lives there.
      #
      # always_run with pass_filenames: false, because the failures it
      # hunts are shaped like absences — a skill directory with no
      # SKILL.md, a citation whose target heading was renamed in a file
      # this commit does not touch — and neither appears in a changed
      # file list.
      - id: governance-frontmatter
        name: every skill and agent definition loads
        entry: .venv/bin/python scripts/check_frontmatter.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-guard
        name: the permission boundary is intact
        entry: bash scripts/check-guard.sh
        language: system
        pass_filenames: false
        always_run: true
