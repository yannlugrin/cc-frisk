# The check families for this repository, pinned. `just check` and the
# commit hook both run this file, so the local runners cannot diverge.
#
# Families arrive with the first artifact of their class. Behaviour,
# measured values and re-measure recipes: .claude/docs/harness.md.
---
# Supplied material, linted at its source (CLAUDE.md rule 3).
exclude: |
  (?x)^(
    \.claude/refs/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixers: they write in the commit hook; `just check` reverts and
      # reports instead (scripts/check.sh).
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Hygiene
      - id: check-merge-conflict
      - id: check-added-large-files
        # --enforce-all, or the hook checks only what is staged and so
        # nothing at all from `just check` or CI.
        args: [--maxkb=512, --enforce-all]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # Rule 5. A committed secret is a rotated secret.
      - id: detect-private-key

      # Does the artifact load, and does it carry what should never have
      # been committed. YAML needs no parse hook: yamllint --strict fails
      # on one already.
      - id: check-ast
      - id: debug-statements
      - id: check-json
      - id: check-toml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.39
    hooks:
      - id: pymarkdown
        args: [--config, .pymarkdown.json, scan]

  # Workflow schema, not a workflow linter (D-027): GitHub answers a
  # malformed workflow by declining to run it.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  # Python style and typing, configured in pyproject.toml and pinned to
  # the interpreter floor (D-030). ruff-format asserts rather than
  # writes; mypy takes its file list from the config, not the arguments.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: [--config-file=pyproject.toml]

  # Two scripts for what a changed-file list cannot see: the guard is
  # gitignored, and a settings file that stopped pointing at it is
  # unchanged on the commit that matters. Hence always_run (D-018).
  - repo: local
    hooks:
      - id: governance-frontmatter
        name: every skill and agent definition loads
        entry: .venv/bin/python scripts/check_frontmatter.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-guard
        name: the permission boundary is intact
        entry: bash scripts/check-guard.sh
        language: system
        pass_filenames: false
        always_run: true
